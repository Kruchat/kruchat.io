[package]
name = "kruchat-io"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.18"
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
tauri = { version = "1.5", features = ["api-all"] }
bcrypt = "0.15"
anyhow = "1.0"
