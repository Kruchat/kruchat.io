[package]
name = "teacher-self-development-log"
version = "0.1.0"
authors = ["Teacher Self-Development Team"]
edition = "2021"
description = "Teacher Self-Development Log desktop application"
license = "MIT"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = [
  "dialog-all",
  "fs-all",
  "shell-open"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
