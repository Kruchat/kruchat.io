version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: teacher-docs-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: teacher-documents
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - teacher-docs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teacher-docs-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/teacher-documents?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-for-production
      JWT_EXPIRE: 7d
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE: 100MB
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - teacher-docs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teacher-docs-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - teacher-docs-network

  nginx:
    image: nginx:alpine
    container_name: teacher-docs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - teacher-docs-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  teacher-docs-network:
    driver: bridge